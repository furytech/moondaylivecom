<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>og</title>
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<style>
  body { margin: 0; background: #222; }
  #stage { width: 1200px; height: 630px; }
  .card {
    width: 1200px; height: 630px; box-sizing: border-box; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at 20% 15%, hsl(239 60% 24%) 0%, #011124 55%, #000814 100%);
    font-family: Georgia, 'Times New Roman', serif; color: #F5E6C8;
    display: flex; align-items: center; padding: 0 80px; gap: 70px;
  }
  .stars span { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #F5E6C8; }
  .glyph { font-size: 300px; line-height: 1; color: #d4af37; text-shadow: 0 0 60px rgba(212,175,55,.35); width: 340px; text-align: center; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols', serif; }
  .txt { flex: 1; position: relative; z-index: 1; }
  .brand { font-size: 22px; letter-spacing: .5em; text-transform: uppercase; color: hsl(239 84% 78%); margin-bottom: 26px; }
  .sign { font-size: 92px; letter-spacing: .06em; text-transform: uppercase; color: #d4af37; line-height: 1.05; }
  .arch { font-size: 28px; letter-spacing: .3em; text-transform: uppercase; color: rgba(245,230,200,.6); margin: 18px 0 34px; }
  .head { font-size: 34px; font-style: italic; line-height: 1.4; color: rgba(245,230,200,.92); max-width: 640px; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 44px; display: flex; justify-content: space-between; font-size: 22px; letter-spacing: .3em; text-transform: uppercase; color: hsl(239 84% 78%); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
(async () => {
  const data = await (await fetch('data.json')).json();
  const stage = document.getElementById('stage');
  const log = [];
  for (const d of data) {
    stage.innerHTML = '';
    const card = document.createElement('div');
    card.className = 'card';
    const stars = Array.from({ length: 60 }, (_, i) => `<span style="top:${(i * 53) % 100}%;left:${(i * 71) % 100}%;opacity:${0.2 + (i % 5) / 10}"></span>`).join('');
    card.innerHTML = `<div class="stars">${stars}</div>
      <div class="glyph">${d.symbol}︎</div>
      <div class="txt">
        <div class="brand">Moonday Live</div>
        <div class="sign">${d.sign} Moon</div>
        <div class="arch">${d.archetype} · ${d.element}</div>
        <div class="head">“${d.headline}.”</div>
      </div>
      <div class="foot"><span>Find your Moon sign</span><span>moondaylive.com</span></div>`;
    stage.appendChild(card);
    await new Promise(r => setTimeout(r, 150));
    const blob = await htmlToImage.toBlob(card, { width: 1200, height: 630, pixelRatio: 1, cacheBust: true });
    const res = await fetch('http://127.0.0.1:8124/save/moon-' + d.sign.toLowerCase() + '.png', { method: 'POST', body: blob });
    log.push(d.sign + ':' + res.status + ':' + blob.size);
  }
  window.__done = log;
  document.title = 'done ' + log.length;
})();
</script>
</body>
</html>
